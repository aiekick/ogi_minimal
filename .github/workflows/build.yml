name: 'Build'

# every host of the os the runner is, on every push : the vendored contrib
# comes with the checkout, ogi is fetched by the configure at its frozen
# commit (cmake/ogiFetch.cmake), the job only installs the system libraries
# the linux hosts link (X11, EGL) ; windows and macos have theirs in the sdk
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# one run per branch at a time ; a newer push supersedes an in-flight run
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libegl-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4
