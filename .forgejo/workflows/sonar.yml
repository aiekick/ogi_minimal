name: SonarQube

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to analyze"
        required: true
        default: master

jobs:
  sonar:
    runs-on: debian13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Submodules
        run: |
          FORGE_HOST="${GITHUB_SERVER_URL#*://}"
          git -c url."https://oauth2:${CHECKOUT_TOKEN}@${FORGE_HOST}/".insteadOf="https://${FORGE_HOST}/" \
              -c url."https://oauth2:${CHECKOUT_TOKEN}@${FORGE_HOST}/".insteadOf="git@${FORGE_HOST}:" \
              submodule update --init --recursive

      - name: Third-party
        run: |
          # Paths of submodules not hosted on my forge / GitHub account
          FORGE_HOST="${GITHUB_SERVER_URL#*://}"
          PATHS=$(git config -f .gitmodules --get-regexp 'submodule\..*\.url' 2>/dev/null \
            | grep -viF -e "${FORGE_HOST}" -e "github.com/aiekick/" -e "github.com:aiekick/" \
            | awk '{sub(/^submodule\./,"",$1); sub(/\.url$/,"",$1); print $1}' \
            | while read -r NAME; do git config -f .gitmodules --get "submodule.${NAME}.path"; done)
          echo "Third-party: ${PATHS:-none}"
          echo "TP_GLOBS=$(printf '%s\n' ${PATHS} | awk 'NF{print $0"/**"}' | paste -sd, -)" >> "$GITHUB_ENV"
          echo "TP_REGEX=$(printf '%s\n' ${PATHS} | awk 'NF' | paste -sd'|' -)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          # Uses .clang-tidy from the repo root; skips old/archives/_deps folders and third-party submodules
          SKIP="old|archives|_deps${TP_REGEX:+|${TP_REGEX}}"
          run-clang-tidy -p build -j"$(nproc)" "^(?!.*/(${SKIP})/)" | tee build/clang-tidy.txt || true

      - name: cppcheck
        run: |
          # Options from .cppcheck-args (one per line, '#' comments allowed), defaults otherwise
          ARGS="--enable=warning,performance,portability"
          if [ -f .cppcheck-args ]; then
            ARGS="$(grep -v '^[[:space:]]*#' .cppcheck-args | xargs)"
          fi
          # Suppressions from .cppcheck-suppressions, if present
          SUPP=""
          if [ -f .cppcheck-suppressions ]; then
            SUPP="--suppressions-list=.cppcheck-suppressions"
          fi
          echo "cppcheck options: ${ARGS} ${SUPP}"
          cppcheck --project=build/compile_commands.json ${ARGS} ${SUPP} \
            --xml --xml-version=2 -j"$(nproc)" 2> build/cppcheck.xml || true

      - name: Analyze
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          EXCLUSIONS="build/**,**/old/**,**/archives/**${TP_GLOBS:+,${TP_GLOBS}}${SONAR_EXTRA_EXCLUSIONS:+,${SONAR_EXTRA_EXCLUSIONS}}"
          echo "Exclusions: ${EXCLUSIONS}"

          KEY="${GITHUB_REPOSITORY/\//::}"
          NAME="${KEY}"
          if [ "${BRANCH}" != "master" ]; then
            SAFE_BRANCH="${BRANCH//[^A-Za-z0-9._-]/-}"
            KEY="${KEY}:${SAFE_BRANCH}"
            NAME="${NAME} [${BRANCH}]"
          fi

          sonar-scanner \
            -Dsonar.projectKey="${KEY}" \
            -Dsonar.projectName="${NAME}" \
            -Dsonar.exclusions="${EXCLUSIONS}" \
            -Dsonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c,.hpp,.hxx,.hh,.h \
            -Dsonar.cxx.jsonCompilationDatabase=build/compile_commands.json \
            -Dsonar.cxx.clangtidy.reportPaths=build/clang-tidy.txt \
            -Dsonar.cxx.cppcheck.reportPaths=build/cppcheck.xml