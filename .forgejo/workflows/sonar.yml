name: SonarQube

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to analyze"
        required: true
        default: master

jobs:
  sonar:
    runs-on: debian13
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
      - name: Fetch CI actions
        run: git clone --depth 1 --branch master "https://oauth2:${CHECKOUT_TOKEN}@${GITHUB_SERVER_URL#*://}/${CI_REPO}.git" .ci
      - uses: ./.ci/sonar-prepare
      - uses: ./.ci/sonar-lint
      - uses: ./.ci/sonar-analyze
        with:
          branch: ${{ inputs.branch || '' }}
          